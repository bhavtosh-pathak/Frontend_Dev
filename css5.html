<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Photo Gallery</h1>
  </header>

  <main class="gallery">
    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature1" alt="Nature 1">
      <div class="caption">Mountain Sunrise</div>
    </div>

    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature2" alt="Nature 2">
      <div class="caption">Calm Lake</div>
    </div>

    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature3" alt="Nature 3">
      <div class="caption">Forest Path</div>
    </div>

    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature4" alt="Nature 4">
      <div class="caption">Desert Dunes</div>
    </div>

    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature5" alt="Nature 5">
      <div class="caption">Ocean Waves</div>
    </div>

    <div class="photo">
      <img src="https://source.unsplash.com/random/800x600?nature6" alt="Nature 6">
      <div class="caption">Starry Night</div>
    </div>
  </main>

</body>
</html>
