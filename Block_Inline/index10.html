<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection Page</title>
</head>
<body>
  <h1>Tourist Selection</h1>

  <label>Country:
    <select>
      <option selected>India</option>
      <option>USA</option>
      <option>Japan</option>
    </select>
  </label><br><br>

  <label>State:
    <select>
      <option selected>Uttar Pradesh</option>
      <option>Maharashtra</option>
      <option>Tamil Nadu</option>
    </select>
  </label><br><br>

  <label>City:
    <select>
      <option selected>Mathura</option>
      <option>Agra</option>
      <option>Lucknow</option>
    </select>
  </label><br><br>

  <label>Favorite Place:
    <select>
      <option selected>Taj Mahal</option>
      <option>Red Fort</option>
      <option>Gateway of India</option>
    </select>
  </label>

  <p>You selected: India → Uttar Pradesh → Mathura → Taj Mahal</p>
</body>
</html>
