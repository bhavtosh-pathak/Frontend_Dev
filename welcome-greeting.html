<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q1 — Welcome Greeting</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>.hidden{display:none}.btn{padding:6px 10px;margin:6px}</style>
</head>
<body>
  <h1 id="greet"></h1>
  <button id="change" class="btn">Change Greeting</button>
  <button id="toggle" class="btn">Toggle Welcome Message</button>
  <div id="welcome">Welcome to our site — enjoy your stay!</div>

  <script>
    function greetingByTime(){
      const h = new Date().getHours();
      return h < 12 ? 'Good Morning!' : h < 18 ? 'Good Afternoon!' : 'Good Evening!';
    }
    $('#greet').text(greetingByTime());

    $('#change').on('click', ()=> $('#greet').text('“Keep going — small steps every day.”'));
    $('#toggle').on('click', ()=> $('#welcome').toggle());
    $('#greet').on('click', ()=> alert('You clicked the greeting!'));
  </script>
</body>
</html>
