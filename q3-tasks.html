<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q3 Task Manager</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body{font-family:Arial;padding:20px}
    .task{padding:8px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
    .left{display:flex;align-items:center}
    .title{margin-left:10px}
  </style>
</head>
<body>
  <h2>Tasks</h2>
  <select id="filter">
    <option value="">-- All --</option>
    <option value="Low">Low Priority</option>
    <option value="Medium">Medium Priority</option>
    <option value="High">High Priority</option>
    <option value="completed">Completed</option>
  </select>
  <div id="list"></div>

  <script>
    function load(filter) {
      var url = 'http://localhost:3003/tasks';
      var data = {};
      if (filter) {
        if (filter === 'completed') data.completed = true;
        else data.priority = filter;
      }
      $('#list').html('<div>Loading...</div>');
      $.ajax({
        url: url,
        data: data,
        success: function(res){
          $('#list').empty();
          if (!res || res.length === 0) { $('#list').html('<div>No tasks</div>'); return; }
          res.forEach(function(t){
            var html = '<div class="task" data-id="'+t.id+'"><div class="left"><input type="checkbox" class="chk" '+(t.completed?'checked':'')+'><div class="title">'+t.title+' <small>['+t.priority+']</small></div></div><div class="status">'+(t.completed?'Done':'Pending')+'</div></div>';
            $('#list').append(html);
          });
        },
        error: function(){ $('#list').html('<div style="color:red">Failed to load tasks</div>'); }
      });
    }

    $(function(){
      load();

      $('#filter').on('change', function(){
        var v = $(this).val();
        load(v);
      });

  
      $('#list').on('change', '.chk', function(){
        var $task = $(this).closest('.task');
        var id = $task.data('id');
        var newVal = $(this).is(':checked');
      
        $task.find('.status').text(newVal ? 'Done' : 'Pending');
        $.ajax({
          url: 'http://localhost:3003/tasks/' + id,
          method: 'PATCH',
          contentType: 'application/json',
          data: JSON.stringify({ completed: newVal }),
          success: function(){}
          ,
          error: function(){
        
            $task.find('.chk').prop('checked', !newVal);
            $task.find('.status').text(!newVal ? 'Done' : 'Pending');
            alert('Failed to update task');
          }
        });
      });
    });
  </script>
</body>
</html>
