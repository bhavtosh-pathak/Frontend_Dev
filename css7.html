<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="style7.css" />
</head>
<body>

  <!-- Fixed Header -->
  <header class="header">
    <h1>My Dashboard</h1>
  </header>

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="#">🏠 Home</a></li>
          <li><a href="#">📊 Analytics</a></li>
          <li><a href="#">📁 Reports</a></li>
          <li><a href="#">⚙️ Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-box">
        <h2>Overview</h2>
        <p>This is the overview section of your dashboard.</p>
      </div>

      <div class="content-box">
        <h2>Statistics</h2>
        <p>Here you can see the latest performance statistics.</p>
      </div>
    </main>
  </div>

</body>
</html>
