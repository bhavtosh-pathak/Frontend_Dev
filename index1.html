<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Responsive Image Filter Gallery</h1>

  <div class="gallery">
    <figure class="img-item blur">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain Landscape">
      <figcaption>Blur Filter</figcaption>
    </figure>

    <figure class="img-item grayscale">
      <img src="https://picsum.photos/id/1025/600/400" alt="Puppy">
      <figcaption>Grayscale Filter</figcaption>
    </figure>

    <figure class="img-item sepia">
      <img src="https://picsum.photos/id/1040/600/400" alt="Lake View">
      <figcaption>Sepia Filter</figcaption>
    </figure>

    <figure class="img-item brightness">
      <img src="https://picsum.photos/id/1052/600/400" alt="Beach">
      <figcaption>Brightness Filter</figcaption>
    </figure>

    <figure class="img-item contrast">
      <img src="https://picsum.photos/id/1069/600/400" alt="Forest">
      <figcaption>Contrast Filter</figcaption>
    </figure>

    <figure class="img-item hue">
      <img src="https://picsum.photos/id/1074/600/400" alt="City Lights">
      <figcaption>Hue-Rotate Filter</figcaption>
    </figure>
  </div>
</body>
</html>
